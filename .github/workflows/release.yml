name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the verified CLI package to npm
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install MinGW
        run: choco install mingw --no-progress -y

      - name: Read version
        shell: pwsh
        run: |
          $line = Select-String -Path build.gradle.kts -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) {
            throw 'build.gradle.kts 里找不到 version = "x.y.z"'
          }
          $version = $line.Matches[0].Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'build.gradle.kts 的 version 是空的'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "APP_VERSION=$version"

      - name: Extract changelog for this version
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          if (-not (Test-Path -LiteralPath 'CHANGELOG.md')) {
            throw '找不到 CHANGELOG.md，发 Release 前先写该版本的更新说明'
          }
          $text = Get-Content -LiteralPath 'CHANGELOG.md' -Raw -Encoding utf8
          $escaped = [regex]::Escape($version)
          $pattern = "(?ms)^##\s+v$escaped\s*\r?\n(.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md 里没有 ## v$version 这一段。点 Run 前先写好该版本的更新说明。"
          }
          $section = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($section)) {
            throw "CHANGELOG.md 里 ## v$version 是空的。补上更新说明再发。"
          }
          $hasBullet = [regex]::IsMatch($section, '(?m)^\s*[-*]\s+\S')
          if (-not $hasBullet) {
            throw "CHANGELOG.md 里 ## v$version 还没有条目。在 新增 / 修复 / 优化 下写完再发。"
          }
          $notes = "# 更新日志$([Environment]::NewLine)$([Environment]::NewLine)## v$version$([Environment]::NewLine)$([Environment]::NewLine)$section"
          [System.IO.File]::WriteAllText(
            (Join-Path $pwd 'release-notes.md'),
            $notes.Trim() + [Environment]::NewLine
          )
          Write-Host "已截取 $($notes.Length) 字更新说明"

      - name: Build CLI distribution
        run: .\gradlew.bat :core:test :cli:test :cli:verifyWindowsNativeJars :cli:packageCli :cli:prepareNpmPackage --no-daemon --stacktrace

      - name: Test Java installation support
        run: node --test npm/test/java.test.mjs

      - name: Pack npm CLI
        run: npm pack ./build/npm/cxclear --pack-destination cli/build/distributions

      - name: Verify npm installation and automatic Java download
        shell: pwsh
        run: node npm/test/install-smoke.mjs "cli/build/distributions/moumoum-cxclear-$env:APP_VERSION.tgz" --download-java

      - name: Save verified npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-cli
          path: cli/build/distributions/moumoum-cxclear-${{ env.APP_VERSION }}.tgz
          if-no-files-found: error

      - name: Build Inno Setup installer
        run: .\gradlew.bat :gui:packageInnoSetup --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CX Clear v${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            cli/build/distributions/CXClear-${{ env.APP_VERSION }}-cli.zip
            cli/build/distributions/moumoum-cxclear-${{ env.APP_VERSION }}.tgz
            gui/build/compose/binaries/main/dist/CXClear-${{ env.APP_VERSION }}-setup.exe
            gui/build/compose/binaries/main/dist/CXClear-${{ env.APP_VERSION }}-setup-no-jre.exe
            gui/build/compose/binaries/main/dist/CXClear-${{ env.APP_VERSION }}-portable.zip
            gui/build/compose/binaries/main/dist/CXClear-${{ env.APP_VERSION }}-portable-no-jre.zip
          prerelease: ${{ contains(env.APP_VERSION, '-') }}
          fail_on_unmatched_files: true
          make_latest: ${{ !contains(env.APP_VERSION, '-') }}

  npm-publish:
    name: Publish npm CLI
    if: ${{ inputs.publish_npm }}
    needs: windows-installer
    runs-on: windows-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download verified npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-cli
          path: npm-artifact

      - name: Publish with trusted publishing
        shell: pwsh
        run: |
          $package = @(Get-ChildItem npm-artifact -Filter 'moumoum-cxclear-*.tgz')
          if ($package.Count -ne 1) { throw 'Expected one verified npm package' }
          $tag = if ($package[0].BaseName -match '^moumoum-cxclear-\d+\.\d+\.\d+-') { 'next' } else { 'latest' }
          npm publish $package[0].FullName --access public --provenance --tag $tag
